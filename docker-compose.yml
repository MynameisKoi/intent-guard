services:
  db-neo4j:
    image: neo4j:5-community
    container_name: intentguard-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data

  db-mongo:
    image: mongo:7
    container_name: intentguard-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data

volumes:
  neo4j_data:
  mongo_data:
